<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="google-site-verification" content="UILQGpcori_CA-DaOuxYGRXpMIaIkQrzuSkSb4kWIuM" />
    <title>Yu-Gi-Oh! Advanced Probability Calculator</title>
    <script type="application/ld+json">
        {
            "@context": "https://schema.org",
            "@type": "WebApplication",
            "name": "Yu-Gi-Oh! Advanced Probability Calculator",
            "url": "https://ygo-calculator.pages.dev/",
            "description": "Calculate exact Yu-Gi-Oh! opening-hand and deck-combo probabilities with overlapping card categories, direct card requirements, and custom constraints.",
            "applicationCategory": "UtilitiesApplication",
            "operatingSystem": "Any"
        }
    </script>
    <base href="/"/>
    <meta name="color-scheme" content="light dark"/>
    <script src="js/theme.js"></script>
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="css/app.css"/>
    <link rel="icon" type="image/png" href="favicon.png"/>
    <link href="YGOProbabilityCalculatorBlazor.styles.css" rel="stylesheet"/>
</head>

<body>
<div id="app">
    <svg class="loading-progress">
        <circle r="40%" cx="50%" cy="50%"/>
        <circle r="40%" cx="50%" cy="50%"/>
    </svg>
    <div class="loading-progress-text"></div>
</div>

<div id="blazor-error-ui">
    An unhandled error has occurred.
    <a href="." class="reload">Reload</a>
    <span class="dismiss">🗙</span>
</div>
<script src="_framework/blazor.webassembly.js"></script>
<script>
    window.downloadFileFromStream = (fileName, base64String) => {
        const link = document.createElement('a');
        link.href = `data:application/json;base64,${base64String}`;
        link.download = fileName;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }
</script>
<script>
    (function () {
        const setMode = (mode) => {
            document.body.classList.toggle('input-mode-mouse', mode === 'mouse');
            document.body.classList.toggle('input-mode-keyboard', mode === 'keyboard');
        };
        setMode('mouse');

        window.addEventListener('mousedown', () => setMode('mouse'), true);
        window.addEventListener('keydown', e => {
            if (!e.metaKey && !e.altKey && !e.ctrlKey) setMode('keyboard');
        }, true);
    })();
</script>
</body>

</html>
