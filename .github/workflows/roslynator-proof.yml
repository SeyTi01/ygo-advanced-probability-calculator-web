name: Disposable Roslynator proof
on:
  pull_request:
    branches: [dev]
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.401
      - name: Run canonical formatter and capture its exact cleanup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'style-worktree'
          git worktree add --detach $root HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Could not create disposable worktree.' }
          Set-Location $root
          dotnet restore YGOProbabilityCalculatorBlazor.sln
          $rcs = @('RCS0008', 'RCS0010', 'RCS0021', 'RCS0053', 'RCS0054', 'RCS0058', 'RCS0063')
          dotnet format whitespace YGOProbabilityCalculatorBlazor.sln --no-restore
          dotnet format analyzers YGOProbabilityCalculatorBlazor.sln --no-restore --severity info --diagnostics @rcs
          git diff --binary --output="$env:RUNNER_TEMP/style-before-whitespace.patch"
          dotnet format analyzers YGOProbabilityCalculatorBlazor.sln --no-restore --severity info --diagnostics @rcs --verify-no-changes
          Write-Host "Analyzer verification before final whitespace exit: $LASTEXITCODE"
          dotnet format whitespace YGOProbabilityCalculatorBlazor.sln --no-restore
          git diff --binary --output="$env:RUNNER_TEMP/style-after-whitespace.patch"
          dotnet format analyzers YGOProbabilityCalculatorBlazor.sln --no-restore --severity info --diagnostics @rcs --verify-no-changes
          Write-Host "Analyzer verification after final whitespace exit: $LASTEXITCODE"
          dotnet tool install Roslynator.DotNet.Cli --version 1.0.0 --tool-path "$env:RUNNER_TEMP/roslynator"
          if ($LASTEXITCODE -ne 0) { throw 'CLI install failed.' }
          dotnet build YGOProbabilityCalculatorBlazor.sln --no-restore
          if ($LASTEXITCODE -ne 0) { throw 'Build before CLI failed.' }
          & "$env:RUNNER_TEMP/roslynator/roslynator" fix YGOProbabilityCalculatorBlazor.sln --supported-diagnostics @rcs --verbosity normal
          if ($LASTEXITCODE -ne 0) { throw 'CLI fix failed.' }
          git diff --binary --output="$env:RUNNER_TEMP/style-cli.patch"
          & "$env:RUNNER_TEMP/roslynator/roslynator" analyze YGOProbabilityCalculatorBlazor.sln --supported-diagnostics @rcs --verbosity normal
          Write-Host "CLI analyze exit: $LASTEXITCODE"
          dotnet format whitespace YGOProbabilityCalculatorBlazor.sln --no-restore --verify-no-changes
          Write-Host "Whitespace verify after CLI exit: $LASTEXITCODE"
      - name: Upload exact standard-tool cleanup
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: standard-style-cleanup
          path: ${{ runner.temp }}/style-*.patch
          if-no-files-found: warn
