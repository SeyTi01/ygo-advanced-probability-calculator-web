name: Disposable Roslynator proof
on:
  pull_request:
    branches: [dev]
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.401
      - name: Run canonical formatter and capture its exact cleanup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'style-worktree'
          git worktree add --detach $root HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Could not create disposable worktree.' }
          Set-Location $root
          ./scripts/style/fix.ps1
          ./scripts/style/check.ps1
          git diff --binary --output="$env:RUNNER_TEMP/style-cleanup.patch"
          ./scripts/style/fix.ps1
          ./scripts/style/check.ps1
          git diff --binary --output="$env:RUNNER_TEMP/style-second.patch"
          if ((Get-FileHash "$env:RUNNER_TEMP/style-cleanup.patch").Hash -ne
              (Get-FileHash "$env:RUNNER_TEMP/style-second.patch").Hash) { throw 'Second fixer run is not idempotent.' }

          $probe = Join-Path $root 'YGOProbabilityCalculatorBlazor/StyleSmoke.cs'
          @'
          namespace StyleSmoke;
          internal class Probe {
          internal int First(int first,
          int second, int third) { var sum = first + second + third; if (sum > 0) return sum; return 0; }
          internal int Second() { return First(1,
          2, 3); }
          }
          '@ | Set-Content -LiteralPath $probe -Encoding utf8NoBOM
          $hash = (Get-FileHash $probe).Hash
          $failed = $false
          try { ./scripts/style/check.ps1 } catch { $failed = $true }
          if (-not $failed -or (Get-FileHash $probe).Hash -ne $hash) { throw 'Dirty check failed its rejection/no-write contract.' }
          ./scripts/style/fix.ps1
          ./scripts/style/check.ps1
          Get-Content $probe
          Remove-Item -LiteralPath $probe
          git diff --binary --output="$env:RUNNER_TEMP/style-after-smoke.patch"
          if ((Get-FileHash "$env:RUNNER_TEMP/style-cleanup.patch").Hash -ne
              (Get-FileHash "$env:RUNNER_TEMP/style-after-smoke.patch").Hash) { throw 'Smoke fix changed the canonical tree.' }
          Write-Host 'PASS: standard-tool wrappers repair a dirty fixture, verify without writes, and converge.'
      - name: Upload exact standard-tool cleanup
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: standard-style-cleanup
          path: ${{ runner.temp }}/style-*.patch
          if-no-files-found: warn
