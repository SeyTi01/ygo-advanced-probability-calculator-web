name: Full test suite

run-name: Tests — ${{ github.ref_name }}

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  style:
    name: C# style verification
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      infrastructure_changed: ${{ steps.check.outputs.infrastructureChanged }}

    steps:
      - name: Check out repository history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up pinned .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Verify C# style without changing the checkout
        id: check
        shell: pwsh
        run: ./scripts/style/check.ps1

  style-infrastructure-regression:
    name: Style infrastructure regression
    needs: style
    if: ${{ !cancelled() && needs.style.outputs.infrastructure_changed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pinned .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Exercise fixer and checker regression suite
        shell: pwsh
        run: pwsh -NoProfile -File scripts/style/test.ps1

  test:
    name: Full test suite
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Show .NET environment
        run: dotnet --info

      - name: Restore
        run: dotnet restore YGOProbabilityCalculatorBlazor.sln

      - name: Build
        run: dotnet build YGOProbabilityCalculatorBlazor.sln --no-restore

      - name: Test
        run: dotnet test YGOProbabilityCalculatorBlazor.sln --no-build --no-restore

      - name: JavaScript tests
        run: node --test
