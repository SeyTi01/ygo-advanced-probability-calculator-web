name: Full test suite

run-name: Tests — ${{ github.ref_name }}

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  style:
    name: C# style verification
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up pinned .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Verify C# style without changing the checkout
        shell: pwsh
        run: ./scripts/style/check.ps1

  test:
    name: Full test suite
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Show .NET environment
        run: dotnet --info

      - name: Restore
        run: dotnet restore YGOProbabilityCalculatorBlazor.sln

      - name: Build
        run: dotnet build YGOProbabilityCalculatorBlazor.sln --no-restore

      - name: Test
        run: dotnet test YGOProbabilityCalculatorBlazor.sln --no-build --no-restore

      - name: JavaScript tests
        run: node --test
