name: Full test suite

run-name: Tests — ${{ github.ref_name }}

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Full test suite
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Show .NET environment
        run: dotnet --info

      - name: Restore
        run: dotnet restore YGOProbabilityCalculatorBlazor.sln

      - name: Build
        run: dotnet build YGOProbabilityCalculatorBlazor.sln --no-restore

      - name: Test
        run: dotnet test YGOProbabilityCalculatorBlazor.sln --no-build --no-restore

      - name: JavaScript tests
        run: node --test

  lint:
    name: Automatic C# cleanup
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pinned .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Apply canonical fixer
        id: fixer
        shell: pwsh
        run: ./scripts/style/fix.ps1

      - name: Require unchanged tree
        id: clean-tree
        shell: bash
        run: |
          git diff --binary > "${RUNNER_TEMP}/lint-fixes.patch"
          git diff --exit-code

      - name: Attach automatic fixes
        if: failure() && steps.clean-tree.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: lint-fixes
          path: ${{ runner.temp }}/lint-fixes.patch
          retention-days: 7

      - name: Verify automatic fixes and idempotence
        if: ${{ !cancelled() && steps.fixer.outcome == 'success' }}
        shell: pwsh
        run: ./scripts/style/test.ps1
